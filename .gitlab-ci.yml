stages:
  - test
  - deploy

include:
# grafana dev-1 — separate stack (network: monitoring)
  - component: $CI_SERVER_FQDN/components/docker/validate-compose@~latest
    inputs:
      as: "lint-grafana-dev-1"
      local_path: "deployments/dev-1"
  - component: $CI_SERVER_FQDN/components/docker/deploy-compose@~latest
    inputs:
      as: "deploy-grafana-dev-1"
      environment: "dev-1"                             # host derives to dev-1-vm.margusm.dev
      local_path: "deployments/dev-1"
      remote_path: "deployments/grafana-dev-1-vm-1"    # unchanged host dir → in-place update

# grafana dev-2 — separate stack (network: grafana)
  - component: $CI_SERVER_FQDN/components/docker/validate-compose@~latest
    inputs:
      as: "lint-grafana-dev-2"
      local_path: "deployments/dev-2"
  - component: $CI_SERVER_FQDN/components/docker/deploy-compose@~latest
    inputs:
      as: "deploy-grafana-dev-2"
      environment: "dev-2"                             # host derives to dev-2-vm.margusm.dev
      local_path: "deployments/dev-2"
      remote_path: "deployments/grafana-dev-2-vm-1"    # unchanged host dir → in-place update
